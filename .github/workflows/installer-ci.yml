name: Installer CI

on:
  push:
    paths:
      - "installer/**"
      - ".github/workflows/installer-ci.yml"
  pull_request:
    paths:
      - "installer/**"
      - ".github/workflows/installer-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-cli:
    name: Source and CLI gates
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.14.1
          cache: npm
          cache-dependency-path: installer/package-lock.json
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.85.0
          components: rustfmt
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: cargo fmt --check --manifest-path cli/Cargo.toml
      - run: npm test
      - run: npm run build:cli
      - run: npm run check:cli-build
      - run: npm run check:host-packages
      - run: npm run check:provenance
      - run: npm run check:tracked-output
      - run: npm run test:isolated
      - run: npm audit --audit-level=high

  cli-native-build:
    name: Native installer — ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
            binary: cli/target/release/jackrabbit-installer-cli
            packaged_binary: jackrabbit-installer
          - runner: windows-2025
            platform: windows-x64
            binary: cli/target/release/jackrabbit-installer-cli.exe
            packaged_binary: jackrabbit-installer.exe
          - runner: macos-15
            platform: macos-arm64
            binary: cli/target/release/jackrabbit-installer-cli
            packaged_binary: jackrabbit-installer
          - runner: macos-15-intel
            platform: macos-x64
            binary: cli/target/release/jackrabbit-installer-cli
            packaged_binary: jackrabbit-installer
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.85.0
          components: rustfmt
      - run: cargo fmt --check --manifest-path cli/Cargo.toml
      - run: cargo test --locked --manifest-path cli/Cargo.toml
      - run: cargo build --locked --release --manifest-path cli/Cargo.toml
      - name: Parse Windows launchers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path windows/install.ps1), [ref]$null, [ref]$errors) | Out-Null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path windows/install-drivers.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }
      - name: Parse Unix launchers
        if: runner.os != 'Windows'
        run: sh -n linux-macos/install.sh linux-macos/install.command
      - name: Stage native executable
        shell: bash
        run: |
          mkdir -p "native-output/jackrabbit-native-${{ matrix.platform }}"
          cp "${{ matrix.binary }}" "native-output/jackrabbit-native-${{ matrix.platform }}/${{ matrix.packaged_binary }}"
      - name: Retain native executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jackrabbit-native-${{ matrix.platform }}
          path: installer/native-output/jackrabbit-native-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
