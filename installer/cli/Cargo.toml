[package]
name = "jackrabbit-installer-cli"
version = "0.1.0-dev"
edition = "2021"
publish = false

[dependencies]
fastboot-protocol = { version = "=0.4.0", default-features = false }
futures = "=0.3.34"
nusb = { version = "=0.2.7", default-features = false, features = ["smol"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serialport = { version = "=4.9.0", default-features = false }
sha2 = "=0.10.9"
